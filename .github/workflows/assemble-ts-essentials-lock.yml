name: assemble-ts-essentials-lock
on:
  push:
    branches: [cursor/honeybee-ts-essentials-10-2-1-bad1]
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/honeybee-ts-essentials-10-2-1-bad1
          fetch-depth: 0
      - name: Restore lockfile and apply ts-essentials 10.2.1 patch
        run: |
          set -euo pipefail
          if grep -q 'ts-essentials@npm:10.2.1' yarn.lock && grep -q '7cb9a335a13141842aa6d887d8c4c28ad9f42807abe712abe8b73bdc99c5882f572f747c6713dd4e823e38c373448a7da6ed4457a97c83ca5a63cbefdde005e5' yarn.lock; then
            echo already assembled
            exit 0
          fi
          git fetch origin c8a38743d0cad6a4742c1a6ef5ec7bf9cbcac297
          git checkout c8a38743d0cad6a4742c1a6ef5ec7bf9cbcac297 -- yarn.lock
          python3 - <<'PY'
          from pathlib import Path
          p = Path('yarn.lock')
          t = p.read_text()
          old = '"ts-essentials@npm:10.0.4"'
          new = '"ts-essentials@npm:10.2.1"'
          if t.count('ts-essentials: 10.0.4') != 1 or t.count(old) != 1:
              raise SystemExit('unexpected lockfile baseline')
          t = t.replace('    ts-essentials: 10.0.4\n', '    ts-essentials: 10.2.1\n', 1)
          t = t.replace(old, new, 1)
          t = t.replace('  version: 10.0.4\n  resolution: "ts-essentials@npm:10.2.1"', '  version: 10.2.1\n  resolution: "ts-essentials@npm:10.2.1"', 1)
          t = t.replace(
              '  checksum: 623bed6950d07b2ca2366e12bc6c0542431a398f052da7b5c78d626267c752312c7fc1c2bc969bd66f157dd68dcb8d9864e7fd59bccd0132c6a29a3a22e9327e',
              '  checksum: 7cb9a335a13141842aa6d887d8c4c28ad9f42807abe712abe8b73bdc99c5882f572f747c6713dd4e823e38c373448a7da6ed4457a97c83ca5a63cbefdde005e5',
              1,
          )
          if 'ts-essentials@npm:10.2.1' not in t or 'ts-essentials: 10.2.1' not in t:
              raise SystemExit('patch failed')
          p.write_text(t)
          PY
          rm -f .github/workflows/assemble-ts-essentials-lock.yml
          git config user.name "Woodii"
          git config user.email "33593572+Woodii1998@users.noreply.github.com"
          git add yarn.lock .github/workflows/assemble-ts-essentials-lock.yml
          git commit -m "chore(deps-dev): update yarn.lock for ts-essentials 10.2.1"
          git push origin HEAD:cursor/honeybee-ts-essentials-10-2-1-bad1
