name: assemble-ts-essentials-lock
on:
  push:
    branches: [cursor/ts-essentials-10-2-1-bad1]
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/ts-essentials-10-2-1-bad1
      - name: Patch yarn.lock in place for ts-essentials 10.2.1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          p = Path('yarn.lock')
          t = p.read_text()
          marker = '"ts-essentials@npm:10.2.1":\n  version: 10.2.1\n  resolution: "ts-essentials@npm:10.2.1"'
          checksum = '7cb9a335a13141842aa6d887d8c4c28ad9f42807abe712abe8b73bdc99c5882f572f747c6713dd4e823e38c373448a7da6ed4457a97c83ca5a63cbefdde005e5'
          if marker in t and checksum in t:
              print('already assembled')
              sys.exit(0)
          if t.count('    ts-essentials: 10.0.4\n') != 1:
              raise SystemExit('unexpected workspace ts-essentials pin')
          old_block = (
              '"ts-essentials@npm:10.0.4":\n'
              '  version: 10.0.4\n'
              '  resolution: "ts-essentials@npm:10.0.4"'
          )
          new_block = (
              '"ts-essentials@npm:10.2.1":\n'
              '  version: 10.2.1\n'
              '  resolution: "ts-essentials@npm:10.2.1"'
          )
          if old_block not in t:
              raise SystemExit('missing ts-essentials 10.0.4 lock descriptor')
          t = t.replace('    ts-essentials: 10.0.4\n', '    ts-essentials: 10.2.1\n', 1)
          t = t.replace(old_block, new_block, 1)
          t = t.replace(
              '  checksum: 623bed6950d07b2ca2366e12bc6c0542431a398f052da7b5c78d626267c752312c7fc1c2bc969bd66f157dd68dcb8d9864e7fd59bccd0132c6a29a3a22e9327e',
              '  checksum: ' + checksum,
              1,
          )
          if marker not in t or checksum not in t:
              raise SystemExit('patch failed')
          if 'ts-essentials@npm:10.0.4' in t or 'ts-essentials: 10.0.4' in t:
              raise SystemExit('old ts-essentials pin still present')
          if '@types/utif@npm:^3.0.6' not in t:
              raise SystemExit('lost utif 3.0.6 lock entry')
          p.write_text(t)
          print('patched yarn.lock')
          PY
          rm -f .github/workflows/assemble-ts-essentials-lock.yml
          git config user.name "Woodii"
          git config user.email "33593572+Woodii1998@users.noreply.github.com"
          git add yarn.lock .github/workflows/assemble-ts-essentials-lock.yml
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "chore(deps-dev): update yarn.lock for ts-essentials 10.2.1"
          git push origin HEAD:cursor/ts-essentials-10-2-1-bad1
