name: one-shot-omgidl-serialization-lock

on:
  push:
    branches:
      - cursor/omgidl-serialization-125-7e35

permissions:
  contents: write

concurrency:
  group: one-shot-omgidl-serialization-lock
  cancel-in-progress: true

jobs:
  patch-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/omgidl-serialization-125-7e35
          fetch-depth: 0

      - name: Patch yarn.lock and remove this workflow
        run: |
          python3 <<'PY'
          from pathlib import Path

          lock = Path("yarn.lock")
          text = lock.read_text()
          old_ptr = '    "@foxglove/omgidl-serialization": 1.2.4\n'
          new_ptr = '    "@foxglove/omgidl-serialization": 1.2.5\n'
          old_block = (
              '"@foxglove/omgidl-serialization@npm:1.2.4":\n'
              "  version: 1.2.4\n"
              '  resolution: "@foxglove/omgidl-serialization@npm:1.2.4"\n'
              "  dependencies:\n"
              '    "@foxglove/cdr": 3.5.0\n'
              '    "@foxglove/message-definition": ^0.5.0\n'
              "  checksum: f9a31d0453b991460e62d1f71d2b1402d6401ccd3d1d75f3257c1dbf25ea2c23962cecd1ed99d6000ff222e7f45654793eed957d0d5bcb97c637cbaf005b77b4\n"
              "  languageName: node\n"
              "  linkType: hard\n"
          )
          new_block = (
              '"@foxglove/omgidl-serialization@npm:1.2.5":\n'
              "  version: 1.2.5\n"
              '  resolution: "@foxglove/omgidl-serialization@npm:1.2.5"\n'
              "  dependencies:\n"
              '    "@foxglove/cdr": 3.5.0\n'
              '    "@foxglove/message-definition": ^0.5.0\n'
              "  checksum: 721d0009ecf6f10b64bde3b6c2b7557c7f8b541f0c26a3ae0ba7aa7858f8d49bd81967c9c78f932bcfb8082b8f5f19fab2b1bb558a8822dcda6877022bd5bf9d\n"
              "  languageName: node\n"
              "  linkType: hard\n"
          )
          if text.count(old_ptr) != 1:
              raise SystemExit(f"expected one 1.2.4 pointer, got {text.count(old_ptr)}")
          if text.count(old_block) != 1:
              raise SystemExit(f"expected one 1.2.4 resolution block, got {text.count(old_block)}")
          text = text.replace(old_ptr, new_ptr, 1).replace(old_block, new_block, 1)
          if "omgidl-serialization@npm:1.2.4" in text or old_ptr in text:
              raise SystemExit("stale omgidl-serialization 1.2.4 remains")
          if text.count(new_ptr) != 1 or text.count(new_block) != 1:
              raise SystemExit("omgidl-serialization 1.2.5 pointers incomplete")
          if '"@foxglove/omgidl-parser@npm:1.2.2"' not in text:
              raise SystemExit("lost omgidl-parser 1.2.2")
          if "jest: 30.5.1" not in text:
              raise SystemExit("lost jest 30.5.1 from #1499")
          lock.write_text(text)

          wf = Path(".github/workflows/one-shot-omgidl-serialization-lock.yml")
          if wf.exists():
              wf.unlink()
          print("patched")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock .github/workflows/one-shot-omgidl-serialization-lock.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(deps): refresh yarn.lock for omgidl-serialization 1.2.5"
          git push origin HEAD:cursor/omgidl-serialization-125-7e35
