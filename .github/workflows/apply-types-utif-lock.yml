name: apply-types-utif-lock

on:
  push:
    branches: [cursor/types-utif-3.0.6-0b02]
    paths:
      - .github/workflows/apply-types-utif-lock.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Patch yarn.lock and remove this helper workflow
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path("yarn.lock")
          t = p.read_text()
          desc_old = '    "@types/utif": ^3.0.2\n'
          desc_new = '    "@types/utif": ^3.0.6\n'
          if t.count(desc_old) != 1:
              raise SystemExit(f"workspace descriptor count {t.count(desc_old)}")
          t = t.replace(desc_old, desc_new, 1)
          block_old = '''"@types/utif@npm:^3.0.2":
            version: 3.0.5
            resolution: "@types/utif@npm:3.0.5"
            dependencies:
              "@types/node": "*"
            checksum: dcf759815e1de0cd60849d76f77dc18be172d740fc56af6f57b350874c6b74cdd8ddef09e2af0b3825a0d07c7da8e461af99f20caffe381778fd1d1f2c821105
          '''
          block_new = '''"@types/utif@npm:^3.0.6":
            version: 3.0.6
            resolution: "@types/utif@npm:3.0.6"
            dependencies:
              "@types/node": "*"
            checksum: 0ba24d4aa321a3e0d317d5eb33c056cf1e977c581e9d83b7b3d93a83aa9aa02e5a72ab1b307e57119f940f56d79cf8c1a25dc0a50793855704cc71fc8b326b40
          '''
          # The triple-quoted strings above were indented by YAML; normalize to yarn.lock indent.
          def undent(s: str) -> str:
              lines = s.splitlines(True)
              return "".join(line[10:] if line.startswith("          ") else line for line in lines)
          block_old = undent(block_old)
          block_new = undent(block_new)
          if t.count(block_old) != 1:
              raise SystemExit(f"lock block count {t.count(block_old)}")
          t = t.replace(block_old, block_new, 1)
          p.write_text(t)
          print("patched yarn.lock", len(t))
          PY
          rm -f .github/workflows/apply-types-utif-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git add -u .github/workflows/apply-types-utif-lock.yml
          git commit -m "chore(deps-dev): lock @types/utif 3.0.6"
          git push
