name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_PACKAGES_ORG_TOKEN: ${{ secrets.GH_PACKAGES_ORG_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable yarn

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - run: yarn install --immutable

      - name: Restore ESLint cache
        uses: actions/cache@v6
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('yarn.lock', 'eslint.config*.cjs', 'eslint/**', 'packages/eslint-plugin/**', 'tsconfig.json', 'tsconfig.eslint.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-eslint-${{ hashFiles('yarn.lock', 'eslint.config*.cjs', 'eslint/**', 'packages/eslint-plugin/**', 'tsconfig.json', 'tsconfig.eslint.json') }}-

      - run: set -x

      - run: yarn run tsc --noEmit
      - run: yarn run lint:ci
      # Runs last: unlike the two steps above, this emits .js/.d.ts files in-place under
      # packages/** (these tsconfigs aren't noEmit), which would otherwise get picked up
      # by lint:ci's glob and produce thousands of bogus errors on generated code.
      - run: yarn run build:packages

  unit-test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_PACKAGES_ORG_TOKEN: ${{ secrets.GH_PACKAGES_ORG_TOKEN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable yarn

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "yarn"

      - run: yarn install --immutable

      - run: yarn run test --ci
