name: one-shot-swc-core-lock

on:
  push:
    branches:
      - cursor/swc-core-1162-4c27

permissions:
  contents: write

concurrency:
  group: one-shot-swc-core-lock
  cancel-in-progress: true

jobs:
  patch-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/swc-core-1162-4c27
          fetch-depth: 0

      - name: Patch yarn.lock and remove this workflow
        run: |
          set -euo pipefail
          python3 <<'PY'
          import re
          from pathlib import Path

          lock = Path("yarn.lock")
          text = lock.read_text()
          pkg = Path("package.json").read_text()
          if '"@swc/core": "1.16.2"' not in pkg:
              raise SystemExit("package.json is not pinned to @swc/core 1.16.2")
          if '"@swc/jest": "0.2.39"' not in pkg:
              raise SystemExit("@swc/jest moved off 0.2.39")
          old_checksum = "ab9fd5fa231670a57a576bd1ebdf69cd042ef0becda8ad04589fc5ffb5f7ade1efc1652e61af7704a6fe5dd3d13e22e73b8ed38d7ce8cadd671e7c6b8fa3d740"
          new_checksum = "06f654f989acfb001885f8823c23406e037be527af83d66b8b88c1b1d5fc4ad939ca67912ce55b7ae40d4bf0bf31b1185fa20cfdb412ad694cc546c49eab436b"
          if old_checksum not in text:
              raise SystemExit("missing @swc/core 1.16.1 checksum")
          if text.count(old_checksum) != 1:
              raise SystemExit(f"expected one 1.16.1 checksum, got {text.count(old_checksum)}")
          text = re.sub(r"(@swc/core(?:-[A-Za-z0-9-]+)?)(@npm:)1\\.16\\.1", r"\\g<1>\\g<2>1.16.2", text)
          text = re.sub(r'(    "@swc/core(?:-[A-Za-z0-9-]+)?": )1\\.16\\.1', r"\\g<1>1.16.2", text)
          text = re.sub(
              r'("@swc/core(?:-[A-Za-z0-9-]+)?@npm:1\\.16\\.2":\\n  version: )1\\.16\\.1',
              r"\\g<1>1.16.2",
              text,
          )
          text = text.replace(old_checksum, new_checksum)
          if '"@swc/core@npm:1.16.1"' in text or "@swc/core-linux-x64-gnu@npm:1.16.1" in text:
              raise SystemExit("stale @swc/core 1.16.1 remains")
          if '"@swc/core@npm:1.16.2"' not in text or '    "@swc/core": 1.16.2' not in text:
              raise SystemExit("@swc/core 1.16.2 pointers incomplete")
          if '"@swc/jest@npm:0.2.39"' not in text or '    "@swc/jest": 0.2.39' not in text:
              raise SystemExit("@swc/jest 0.2.39 drifted")
          if '"rtl-css-js@npm:^1.16.1"' not in text:
              raise SystemExit("rtl-css-js 1.16.1 was rewritten")
          if "electron: 35.0.3" not in text:
              raise SystemExit("electron pin changed")
          lock.write_text(text)

          wf = Path(".github/workflows/one-shot-swc-core-lock.yml")
          if wf.exists():
              wf.unlink()
          print("patched")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock .github/workflows/one-shot-swc-core-lock.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(deps): refresh yarn.lock for @swc/core 1.16.2"
          git push origin HEAD:cursor/swc-core-1162-4c27
