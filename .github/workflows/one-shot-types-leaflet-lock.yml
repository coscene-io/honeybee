name: one-shot-types-leaflet-lock

on:
  push:
    branches:
      - cursor/types-leaflet-1922-31d6

permissions:
  contents: write

concurrency:
  group: one-shot-types-leaflet-lock
  cancel-in-progress: true

jobs:
  patch-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cursor/types-leaflet-1922-31d6
          fetch-depth: 0

      - name: Patch yarn.lock and remove this workflow
        run: |
          python3 <<'PY'
          from pathlib import Path

          lock = Path("yarn.lock")
          text = lock.read_text()
          old_ptr = '    "@types/leaflet": 1.9.16\n'
          new_ptr = '    "@types/leaflet": 1.9.22\n'
          old_block = (
              '"@types/leaflet@npm:1.9.16":\n'
              "  version: 1.9.16\n"
              '  resolution: "@types/leaflet@npm:1.9.16"\n'
              "  dependencies:\n"
              '    "@types/geojson": "*"\n'
              "  checksum: f9eba777c90492a4dea50fdc3f48d074a5ac13b2fa3e58b1d18d07889252e823623c64ead4b6b8c15e5dd4ba2bded296048b8e6d1164ad18584018211c23eb51\n"
              "  languageName: node\n"
              "  linkType: hard\n"
          )
          new_block = (
              '"@types/leaflet@npm:1.9.22":\n'
              "  version: 1.9.22\n"
              '  resolution: "@types/leaflet@npm:1.9.22"\n'
              "  dependencies:\n"
              '    "@types/geojson": "*"\n'
              "  checksum: fb3b54f7c8ea2e3ca84d41c6ad06e418ec87a15c30c820f33e60cf91eadb3950392a794c870e5a01daa66dccda05a0d97067ba303299b1e479f579329e652d6a\n"
              "  languageName: node\n"
              "  linkType: hard\n"
          )
          if text.count(old_ptr) != 1:
              raise SystemExit(f"expected one 1.9.16 pointer, got {text.count(old_ptr)}")
          if text.count(old_block) != 1:
              raise SystemExit(f"expected one 1.9.16 block, got {text.count(old_block)}")
          text = text.replace(old_ptr, new_ptr, 1)
          text = text.replace(old_block, new_block, 1)
          if '"@types/leaflet@npm:1.9.16"' in text or old_ptr in text:
              raise SystemExit("stale @types/leaflet 1.9.16 remains")
          if '"@types/leaflet@npm:1.9.22"' not in text or text.count(new_ptr) != 1:
              raise SystemExit("@types/leaflet 1.9.22 pointers incomplete")
          if '"leaflet@npm:1.9.4"' not in text or "    leaflet: 1.9.4\n" not in text:
              raise SystemExit("runtime leaflet 1.9.4 lost")
          if '    "@types/geojson": 7946.0.14\n' not in text:
              raise SystemExit("studio-base @types/geojson 7946.0.14 pin lost")
          if '"@types/geojson@npm:7946.0.16"' in text or '    "@types/geojson": 7946.0.16\n' in text:
              raise SystemExit("do not pull @types/geojson 7946.0.16 in this PR")
          star = '"@types/geojson@npm:*":\n  version: 7946.0.11\n'
          if star not in text:
              raise SystemExit("@types/geojson * resolution drifted from 7946.0.11")
          lock.write_text(text)

          wf = Path(".github/workflows/one-shot-types-leaflet-lock.yml")
          if wf.exists():
              wf.unlink()
          print("patched")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock .github/workflows/one-shot-types-leaflet-lock.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(deps-dev): refresh yarn.lock for @types/leaflet 1.9.22"
          git push origin HEAD:cursor/types-leaflet-1922-31d6
